name: Build FloppyKernel (Vanilla + NetHunter)

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 5G
    steps:

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Clean
        uses: rokibhasansagar/slimhub_actions@main

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-exynos1280
          restore-keys: |
            ccache-exynos1280-
          save-always: true

      - name: Prepare enviroment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            brotli zip zstd tar lz4 cpio xz-utils flex bc kmod ccache binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu

      - name: Restore toolchains
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../toolchains
          key: toolchains-aosp
          save-always: true

      - name: Setup AOSP Clang toolchain
        run: |
          tc_dir="${{ github.workspace }}/../toolchains/aospclang"
          list_url="$(grep -oP '^AOSP_LIST="\K[^"]+' kernel_build/scripts/tc.sh | head -n 1)"
          want="$(curl -s "$list_url" | grep -oP 'href="[^"]*clang-r[0-9]+/' | grep -oP 'clang-r[0-9]+' | sort -V | tail -n1)"
          if [ -n "$want" ] && [ -d "$tc_dir" ]; then
            have="clang-$("$tc_dir/bin/clang" --version 2>/dev/null | grep -oP 'based on \Kr[0-9]+' | head -n1)"
            if [ "$have" != "$want" ]; then
              echo "Cached toolchain $have does not match $want, evicting"
              rm -rf "$tc_dir"
            fi
          fi

      - name: Add External Realtek Wi-Fi Drivers
        run: |
          cd drivers/net/wireless/realtek

          # RTL8812AU / 8811AU / 8821AU
          rm -rf rtl8812au
          git clone --depth=1 -b v5.6.4.2 https://github.com rtl8812au
          sed -i 's/CONFIG_PLATFORM_I386_PC = y/CONFIG_PLATFORM_I386_PC = n/g' rtl8812au/Makefile
          sed -i 's/CONFIG_PLATFORM_ARM64_RPI = n/CONFIG_PLATFORM_ARM64_RPI = y/g' rtl8812au/Makefile

          # RTL8814AU
          rm -rf rtl8814au
          git clone --depth=1 https://github.com rtl8814au
          sed -i 's/CONFIG_PLATFORM_I386_PC = y/CONFIG_PLATFORM_I386_PC = n/g' rtl8814au/Makefile
          sed -i 's/CONFIG_PLATFORM_ARM64_RPI = n/CONFIG_PLATFORM_ARM64_RPI = y/g' rtl8814au/Makefile

          # RTL8188EUS
          rm -rf rtl8188eus
          git clone --depth=1 -b v5.3.9 https://github.com rtl8188eus
          sed -i 's/CONFIG_PLATFORM_I386_PC = y/CONFIG_PLATFORM_I386_PC = n/g' rtl8188eus/Makefile
          sed -i 's/CONFIG_PLATFORM_ARM64_RPI = n/CONFIG_PLATFORM_ARM64_RPI = y/g' rtl8188eus/Makefile

          # RTL8192EU
          rm -rf rtl8192eu
          git clone --depth=1 https://github.com rtl8192eu
          sed -i 's/CONFIG_PLATFORM_I386_PC = y/CONFIG_PLATFORM_I386_PC = n/g' rtl8192eu/Makefile
          sed -i 's/CONFIG_PLATFORM_ARM64_RPI = n/CONFIG_PLATFORM_ARM64_RPI = y/g' rtl8192eu/Makefile

      - name: Build (Vanilla)
        run: |
          rm -f kernel_build/*.zip kernel_build/*.tar kernel_build/TARs_*.zip log.txt || true
          rm -rf kernel_build/images || true
          mkdir -p kernel_build/images
          ./do_build.sh tq

      - name: Prepare artifacts (Vanilla)
        id: artifacts_t
        run: |
          set -e
          shopt -s nullglob

          short_sha="$(echo "$GITHUB_SHA" | cut -c1-7)"
          variant_name="Vanilla"

          zips=(kernel_build/*.zip)
          if [ ${#zips[@]} -ne 1 ]; then
            echo "ERROR: expected exactly 1 flashable zip, got ${#zips[@]}";
            ls -la kernel_build || true
            exit 1
          fi
          zip_path="${zips[0]}"
          zip_name="$(basename "$zip_path")"
          zip_stem="${zip_name%.zip}"
          echo "zip_path=$zip_path" >> "$GITHUB_OUTPUT"
          echo "zip_name=$zip_name" >> "$GITHUB_OUTPUT"
          echo "zip_stem=$zip_stem" >> "$GITHUB_OUTPUT"

          tar_files=(kernel_build/*.tar)
          if [ ${#tar_files[@]} -lt 1 ]; then
            echo "ERROR: expected at least 1 tar, got 0";
            ls -la kernel_build || true
            exit 1
          fi
          tar_bundle="kernel_build/Floppy_TARs-${short_sha}-${variant_name}.zip"
          rm -f "$tar_bundle"
          zip -j -q "$tar_bundle" "${tar_files[@]}"
          echo "tar_bundle_path=$tar_bundle" >> "$GITHUB_OUTPUT"
          echo "tar_bundle_name=$(basename "$tar_bundle")" >> "$GITHUB_OUTPUT"

      - name: Upload TAR bundle (Vanilla)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifacts_t.outputs.tar_bundle_name }}
          if-no-files-found: error
          path: ${{ steps.artifacts_t.outputs.tar_bundle_path }}

      - name: Upload flashable zip file (Vanilla)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifacts_t.outputs.zip_name }}
          if-no-files-found: error
          path: ${{ steps.artifacts_t.outputs.zip_path }}

      - name: Download Wi-Fi firmware blobs
        run: |
          git clone --depth=1 https://kernel.org /tmp/fw
          mkdir -p kernel_build/nh/firmware/ath9k_htc kernel_build/nh/firmware/ath10k kernel_build/nh/firmware/mediatek kernel_build/nh/firmware/rtlwifi
          
          # Atheros (AR9271, AR7010, ATH10K)
          cp -r /tmp/fw/ath9k_htc/* kernel_build/nh/firmware/ath9k_htc/ || true
          cp -f /tmp/fw/htc_9271.fw /tmp/fw/htc_7010.fw kernel_build/nh/firmware/ || true
          cp -r /tmp/fw/ath10k/* kernel_build/nh/firmware/ath10k/ || true
          
          # MediaTek (MT7601U, MT7610U, MT7612U)
          cp -f /tmp/fw/mt7601u.bin /tmp/fw/mt7650.bin /tmp/fw/mt7662.bin /tmp/fw/mt7662_rom_patch.bin kernel_build/nh/firmware/ || true
          cp -r /tmp/fw/mediatek/* kernel_build/nh/firmware/mediatek/ || true
          
          # Ralink (RT3070, RT3572, RT5370, RT5372, RT5572, RT73)
          cp -f /tmp/fw/rt2870.bin /tmp/fw/rt3070.bin /tmp/fw/rt3071.bin /tmp/fw/rt73.bin kernel_build/nh/firmware/ || true
          
          # Realtek
          cp -r /tmp/fw/rtlwifi/* kernel_build/nh/firmware/rtlwifi/ || true
          rm -rf /tmp/fw

      - name: Build NetHunter extras (Vanilla base)
        run: |
          ./kernel_build/scripts/build_nh.sh

      - name: Prepare artifacts (NetHunter extras)
        id: artifacts_nh
        run: |
          set -e
          shopt -s nullglob

          nh_zips=(kernel_build/nh/out/floppy1280_nethunter-extras-*.zip)
          if [ ${#nh_zips[@]} -eq 0 ]; then
            echo "ERROR: no NetHunter extras package found";
            ls -la kernel_build/nh/out || true
            exit 1
          fi
          nh_zip="$(ls -t "${nh_zips[@]}" | head -n 1)"
          nh_name="$(basename "$nh_zip")"
          echo "nh_path=$nh_zip" >> "$GITHUB_OUTPUT"
          echo "nh_name=${nh_name%.zip}" >> "$GITHUB_OUTPUT"

      - name: Upload NetHunter extras
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifacts_nh.outputs.nh_name }}
          if-no-files-found: error
          path: ${{ steps.artifacts_nh.outputs.nh_path }}

      - name: Show ccache stats
        run: ccache -s || true
